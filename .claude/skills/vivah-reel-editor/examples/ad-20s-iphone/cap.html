<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=block">
<style>html,body{margin:0;width:1080px;height:1920px;background:transparent}
#c{position:absolute;font-family:Poppins;font-weight:800;color:#fff;line-height:1.15;text-shadow:0 3px 14px rgba(0,0,0,.6),0 0 3px rgba(0,0,0,.7)}
#c.full{left:70px;right:70px;top:1220px;text-align:center;font-size:84px}
#c.side{left:50px;right:50px;top:118px;text-align:center;font-size:64px}#c.side .bx{display:inline}
#c span{display:inline-block;margin:0 .14em}#c span.a{color:#FFE27A;transform:scale(1.06)}
</style></head><body><div id="c"></div>
<script>window.set=(s)=>{const c=document.getElementById('c');c.className=s.area;const h=s.words.map((w,i)=>`<span class="${i==s.act?'a':''}">${w}</span>`).join(' ');c.innerHTML=s.area=='side'?`<span class="bx">${h}</span>`:h}</script></body></html>
