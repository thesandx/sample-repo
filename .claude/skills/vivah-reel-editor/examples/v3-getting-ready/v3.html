<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#111}
.abs{position:absolute}
#bgwrap{inset:0;overflow:hidden}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 28%}
#dim{inset:0;background:rgba(20,8,14,.35);opacity:0}

#hook{left:50px;width:980px;top:130px;text-align:center;font-family:'Poppins';font-weight:800;font-size:70px;line-height:1.1;color:#fff;-webkit-text-stroke:5px #2a1420;paint-order:stroke fill;text-shadow:0 6px 14px rgba(0,0,0,.35)}
#cap{left:60px;width:960px;text-align:center}
#cap .w{display:inline-block;color:#fff;font-family:'Poppins';font-weight:800;font-size:54px;line-height:1.15;padding:2px 12px 8px;margin:0 1px;border-radius:12px;-webkit-text-stroke:3px #1a1a1a;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.35)}
#cap .w.on{background:#D62E55;-webkit-text-stroke:0;text-shadow:none}
/* phone */
#phone{left:300px;top:690px;width:516px;height:853px;background:#141414;padding:18px;border-radius:52px;box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 0 0 3px #3a3a3a}
#phone .in{width:480px;height:817px;border-radius:36px;overflow:hidden;position:relative;background:#000}
#phone .in img.sc{position:absolute;left:0;top:0;width:480px;height:817px}

#wa .av{width:58px;height:58px;border-radius:50%;background:#FF7A9C;display:flex;align-items:center;justify-content:center;font-size:30px}
#wa .b{position:absolute;max-width:380px;border-radius:16px;padding:8px;box-shadow:0 1px 2px rgba(0,0,0,.2);font-size:24px;color:#111}
#wa .s{right:16px;background:#D9FDD3}
#wa .r{left:16px;background:#fff;font-size:28px;padding:14px 18px}
#wa .lk img{width:364px;height:200px;object-fit:cover;border-radius:10px;display:block}

#wa .lk .u{color:#027EB5;font-size:22px;margin:0 6px 4px}
#wa .lk .m{font-size:26px;margin:6px 6px 2px}
#wa .tm{font-size:18px;color:#667;text-align:right;margin-top:2px}
/* friend reactions over Priya */
.fr{display:flex;gap:14px;align-items:flex-end;font-family:'Roboto'}
.fr .av{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:700;font-size:32px;color:#fff;flex:none;border:4px solid #fff}
.fr .bb{background:#fff;border-radius:26px 26px 26px 6px;padding:16px 24px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.fr .bb b{display:block;font-size:24px;color:#D62E55;font-weight:500}
.fr .bb span{font-size:36px;color:#111}
.pop{display:flex;align-items:center;gap:12px;font-family:'Poppins';font-weight:900;font-size:60px;color:#fff;white-space:nowrap}
.pop span{background:#5B2A86;padding:8px 28px 14px;border-radius:22px;border:5px solid #fff;box-shadow:0 10px 24px rgba(0,0,0,.35);position:relative}
.pop span i{position:absolute;left:14px;right:14px;top:50%;height:10px;background:#FFD84D;border-radius:5px;transform:rotate(-6deg) scaleX(0);transform-origin:left}
.pop img{width:120px;height:120px;filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff)}
#stamp{left:170px;top:1100px;width:740px;text-align:center;font-family:'Poppins';font-weight:900;color:#D62E55;font-size:120px;line-height:1;border:12px solid #D62E55;border-radius:26px;padding:18px 10px 26px;background:rgba(255,252,248,.93);box-shadow:0 20px 40px rgba(0,0,0,.35)}
#stamp small{display:block;font-weight:800;font-size:40px;letter-spacing:3px;color:#3D1F2E;margin-top:8px}
#end{inset:0;background:#FFFCF8;display:flex;flex-direction:column;align-items:center;padding-top:300px}
#end img{width:540px}
#end .t{font-family:'Huninn';font-size:62px;color:#3D1F2E;margin-top:60px;text-align:center;line-height:1.2}
#end .u{margin-top:36px;background:#D62E55;color:#fff;font-family:'Huninn';font-size:80px;padding:14px 58px 24px;border-radius:70px}
#end .p{margin-top:36px;font-family:'Poppins';font-weight:800;font-size:46px;color:#5B2A86}
#flashw{inset:0;background:#fff;opacity:0}
</style></head><body>

 <div id="wa"><div class="hd"><div class="av">💕</div>Neha</div>

 </div></div></div>

<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eBack=x=>{const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function set(el,o,x=0,y=0,s=1,r=0){el.style.opacity=o;el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;}
const M=[0,4.6,11.05,17.7,23.05,28.4], END=M[5]+1.7, NF=974;
const W=[
 [0,[[0.6,'Pata'],[1.16,'hai,'],[1.8,'meri'],[1.98,'shaadi'],[2.3,'ka'],[2.44,'invite'],[2.78,'dekh ke'],[3.1,'saare'],[3.4,'friends'],[3.66,'pagal'],[4.04,'ho gaye!']]],
 [1,[[0,'Humne'],[0.36,'apni'],[0.58,'khud ki'],[1.0,'wedding'],[1.32,'website'],[1.74,'banayi,'],[2.26,'itni'],[2.64,'pyaari!'],[3.16,'Aur'],[4.3,'har'],[4.5,'friend ko'],[4.84,'uska'],[5.2,'personal'],[5.62,'link'],[5.84,'bheja.']]],
 [2,[[0,'Link'],[0.74,'kholte hi'],[1.08,'unka'],[1.34,'naam'],[1.62,'aata hai,'],[2.24,'bilkul'],[2.5,'paper'],[2.86,'card'],[3.14,'jaisa!'],[4.28,'Sab'],[4.6,'pooch'],[4.84,'rahe the,'],[5.24,'yaar'],[5.52,'ye'],[5.66,'kaise'],[5.98,'banaya?']]],
 [3,[[0,'Date'],[0.8,'scratch'],[1.12,'karke'],[1.46,'reveal'],[1.8,'hoti hai,'],[2.74,'aur'],[2.92,'venue,'],[3.3,'saare'],[4.08,'functions'],[4.5,'bhi'],[4.62,'wahi pe.']]],
 [4,[[0,'Sab'],[0.74,'soch'],[1.04,'rahe the'],[1.3,'bahut'],[1.6,'mehenga'],[1.98,'hoga...'],[2.66,'main'],[2.76,'boli,'],[3.26,'na'],[3.4,'yaar,'],[3.94,'bas'],[4.04,'₹799!']]],
 [5,[[0,'vivah.online,'],[1.7,'link'],[2.52,'bio'],[2.78,'mein hai!']]],
];
const words=[];W.forEach(([si,ws])=>ws.forEach(([t,w])=>words.push({t:M[si]+t,w})));
// group: new group when gap > .45s, new segment, or 4 words
const grp=[];let g=0;words.forEach((w,i)=>{if(i>0){const p=words[i-1];const n=i-grp.indexOf(g);if(w.t-p.t>0.75||n>=4||M.includes(w.t))g++;}grp.push(g);});
const cuts=[0,1.8,M[1],M[1]+3.16,M[2],M[2]+4.28,M[3],M[3]+2.74,M[4],M[4]+2.66,M[4]+3.94,M[5]];
// phone windows
const PH=[[M[1]+2.26,M[2]+3.15],[M[3],M[4]]];
const inPhone=t=>PH.some(([a,b])=>t>=a&&t<b);
const WA=[M[1]+4.3,M[2]];
// friend reactions
const FR=[['R','Riya','Yaar ye kahan se banaya?? 😍','#5B2A86',60,240],['A','Ankit','Bhai mera naam likha hai 😂🔥','#D62E55',200,420],['S','Simran','Kitne ka pada?? 👀','#2B6CB0',90,600]];
const frs=FR.map(([i,n,m,c,x,y],k)=>{const d=document.createElement('div');d.className='abs fr';d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=`<div class="av" style="background:${c}">${i}</div><div class="bb"><b>${n}</b><span>${m}</span></div>`;$('frs').appendChild(d);return {d,a:M[2]+4.28+k*0.5};});
// pops [t0,t1,text,sticker,x,y,strikeAt]
const PO=[[M[4]+1.3,M[4]+3.94,'Bahut mehenga?','money',200,300,M[4]+3.3],[M[5],END,'LINK BIO MEIN','point',220,300,0]];
const pops=PO.map(([a,b,tx,st,x,y,s])=>{const d=document.createElement('div');d.className='abs pop';d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=`<span>${tx}<i></i></span><img src="../r2/st/${st}.png">`;$('pops').appendChild(d);return {a,b,d,s};});
function ellipse(cx,cy,rx,ry,k){let d='';const n=60,end=k*1.12;for(let i=0;i<=n;i++){const a=-2.3+end*2*Math.PI*i/n;const wob=1+0.04*Math.sin(i*1.7);d+=(i?'L':'M')+(cx+Math.cos(a)*rx*wob).toFixed(1)+' '+(cy+Math.sin(a)*ry*wob).toFixed(1);}return d;}
let lastBg='',lastSc='';
function render(t){
 const fi=Math.min(NF,Math.floor(t*30+1e-6));const b='bg/f'+String(fi).padStart(5,'0')+'.jpg';if(b!==lastBg){$('bg').src=b;lastBg=b;}
 let ci=0;for(let i=0;i<cuts.length;i++)if(t>=cuts[i])ci=i;const lc=t-cuts[ci];
 const base=ci%2?1.32:1.14;const kick=0.05*(1-eOut(lin(lc,0,0.22)));
 $('bg').style.transform=`scale(${base+kick+lc*0.006})`;
 $('flashw').style.opacity=ci>0?0.35*(1-lin(lc,0,0.07)):0;
 // hook
 {const a=0.1,bb=M[1]-0.1;const k=lin(t,a,a+0.3);set($('hook'),t>=a&&t<bb?Math.min(1,k*2)*(1-lin(t,bb-0.15,bb)):0,0,(1-eOut(k))*-40,0.85+0.15*eBack(k));}
 // phone
 const ph=PH.find(([a,b])=>t>=a&&t<b);
 if(ph){const [a,b]=ph;const k=lin(t,a,a+0.35);set($('phone'),1-lin(t,b-0.12,b),0,(1-eOut(k))*1100,0.85+0.15*eBack(k),3+Math.sin(t*1.5)*1.2);
  const s='sc/f'+String(Math.min(990,Math.floor(t*30))).padStart(5,'0')+'.jpg';if(s!==lastSc){$('sc').src=s;lastSc=s;}
  $('dim').style.opacity=lin(t,a,a+0.25)*(1-lin(t,b-0.12,b));
 } else {$('phone').style.opacity=0;$('dim').style.opacity=0;}
 // whatsapp screen
 {const on=t>=WA[0]&&t<WA[1];$('wa').style.opacity=on?1:0;
  const k1=lin(t,WA[0]+0.15,WA[0]+0.35);set($('wa1'),on&&t>=WA[0]+0.15?1:0,0,0,0.75+0.25*eOut(k1));$('wa1').style.transformOrigin='right bottom';
  const k2=lin(t,WA[0]+1.2,WA[0]+1.4);set($('wa2'),on&&t>=WA[0]+1.2?1:0,0,0,0.75+0.25*eOut(k2));$('wa2').style.transformOrigin='left bottom';}
 // ring around guest name on gate
 {const a=M[2]+1.2,bb=M[2]+3.15;const on=t>=a&&t<bb;const k=eOut(lin(t,a,a+0.4));
  // phone inner origin ~ (318,708) rotated 3deg; name at y .82 of inner
  $('ringp').setAttribute('d',on?ellipse(565,1390,170,56,k):'');$('ring').style.opacity=on?1-lin(t,bb-0.12,bb):0;}
 // friend reactions
 frs.forEach(({d,a})=>{const bb=M[3];const k=lin(t,a,a+0.25);set(d,t>=a&&t<bb?Math.min(1,k*2)*(1-lin(t,bb-0.12,bb)):0,0,(1-eOut(k))*40,0.7+0.3*eBack(k));d.style.transformOrigin='left bottom';});
 // pops
 pops.forEach(({a,b,d,s})=>{const on=t>=a&&t<b;const k=lin(t,a,a+0.28);set(d,on?Math.min(1,k*2.5)*(1-lin(t,b-0.12,b)):0,0,0,0.3+0.7*eBack(k),-3);
  if(s)d.querySelector('i').style.transform=`rotate(-6deg) scaleX(${eOut(lin(t,s,s+0.3))})`;});
 // stamp
 {const a=M[4]+3.94,bb=M[5];const k=lin(t,a,a+0.18);set($('stamp'),t>=a&&t<bb?Math.min(1,k*2)*(1-lin(t,bb-0.1,bb)):0,0,0,2.1-1.1*eOut(k),-6);}
 // captions (hidden on stamp / end / reactions)
 let wi=-1;words.forEach((w,i)=>{if(t>=w.t)wi=i;});
 const hideCap=t>=END||(t>=M[4]+3.94&&t<M[5])||(t>=M[2]+4.28&&t<M[3]);
 if(wi>=0&&!hideCap&&t-words[wi].t<1.6){let h='';for(let i=0;i<=wi;i++)if(grp[i]===grp[wi])h+=`<span class="w${i===wi?' on':''}">${words[i].w}</span>`;
  $('cap').innerHTML=h;$('cap').style.top=(inPhone(t)?380:1340)+'px';$('cap').style.opacity=1;
  const k=lin(t,words[wi].t,words[wi].t+0.08);$('cap').style.transform=`scale(${1+0.05*(1-k)})`;
 } else $('cap').style.opacity=0;
 // end card
 {const k=lin(t,END,END+0.3);$('end').style.opacity=k;$('end').style.transform=`scale(${1.06-0.06*eOut(k)})`;}
}
window.render=render;
window.imgReady=()=>Promise.all([...document.images].filter(i=>!i.complete).map(i=>new Promise(r=>{i.onload=i.onerror=r;})));
document.fonts.ready.then(()=>render(0));
</script></body></html>
