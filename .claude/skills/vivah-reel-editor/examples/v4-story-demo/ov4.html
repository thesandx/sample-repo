<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Huninn&family=Roboto:wght@400;500&display=block">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
.abs{position:absolute}
.full{inset:0}
#hook{left:50px;width:980px;top:150px;text-align:center;font-family:'Poppins';font-weight:800;font-size:72px;line-height:1.1;color:#fff;-webkit-text-stroke:5px #2a1420;paint-order:stroke fill;text-shadow:0 6px 14px rgba(0,0,0,.35)}
/* guest gates */
#gates img{position:absolute;inset:0;width:1080px;height:1920px;opacity:0}
#ring{left:0;top:0;width:1080px;height:1920px}
/* whatsapp full screen */
#wa{background:#EFE7DE;font-family:'Roboto';opacity:0}
#wa .hd{height:230px;background:#075E54;color:#fff;display:flex;align-items:flex-end;padding:0 40px 34px;gap:26px;font-size:54px;font-weight:500}
#wa .av{width:100px;height:100px;border-radius:50%;background:#FF7A9C;display:flex;align-items:center;justify-content:center;font-size:54px}
#wa .b{position:absolute;max-width:760px;border-radius:26px;padding:14px;box-shadow:0 2px 4px rgba(0,0,0,.18);color:#111}
#wa .s{right:36px;background:#D9FDD3;transform-origin:right bottom}
#wa .r{left:36px;background:#fff;font-size:52px;padding:24px 32px;transform-origin:left bottom}
#wa .lk img{width:730px;height:400px;object-fit:cover;border-radius:18px;display:block}
#wa .lk .t{font-weight:500;font-size:44px;margin:16px 10px 4px}
#wa .lk .u{color:#027EB5;font-size:40px;margin:0 10px 6px}
#wa .lk .m{font-size:48px;margin:12px 10px 4px}
#wa .tm{font-size:30px;color:#667;text-align:right;margin-top:4px}
/* friends' reactions */
.fr{display:flex;gap:18px;align-items:flex-end;font-family:'Roboto';transform-origin:left bottom}
.fr .av{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:700;font-size:44px;color:#fff;flex:none;border:5px solid #fff}
.fr .bb{background:#fff;border-radius:34px 34px 34px 8px;padding:20px 30px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.fr .bb b{display:block;font-size:32px;color:#D62E55;font-weight:500}
.fr .bb span{font-size:50px;color:#111}
.pop{display:flex;align-items:center;gap:14px;font-family:'Poppins';font-weight:900;font-size:64px;color:#fff;white-space:nowrap}
.pop span{background:#D62E55;padding:10px 30px 16px;border-radius:24px;border:5px solid #fff;box-shadow:0 10px 24px rgba(0,0,0,.35);position:relative}
.pop span.j{background:#5B2A86}
.pop span i{position:absolute;left:16px;right:16px;top:50%;height:11px;background:#FFD84D;border-radius:6px;transform:rotate(-6deg) scaleX(0);transform-origin:left}
.pop img{width:130px;height:130px;filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(4px 8px 6px rgba(0,0,0,.3))}
.rip{width:150px;height:150px;border-radius:50%;border:10px solid rgba(255,255,255,.95);box-shadow:0 0 0 6px rgba(214,46,85,.6)}
.dot{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.35)}
#stamp{left:300px;top:560px;width:720px;text-align:center;font-family:'Poppins';font-weight:900;color:#D62E55;font-size:120px;line-height:1;border:12px solid #D62E55;border-radius:28px;padding:20px 10px 26px;background:rgba(255,252,248,.95);box-shadow:0 20px 40px rgba(0,0,0,.4)}
#stamp small{display:block;font-weight:800;font-size:40px;letter-spacing:3px;color:#3D1F2E;margin-top:10px}
#end{background:#FFFCF8;display:flex;flex-direction:column;align-items:center;padding-top:190px}
#end img{width:500px}
#end .t{font-family:'Huninn';font-size:60px;color:#3D1F2E;margin-top:50px;text-align:center;line-height:1.2}
#end .u{margin-top:34px;background:#D62E55;color:#fff;font-family:'Huninn';font-size:78px;padding:14px 56px 24px;border-radius:70px}
#end .p{margin-top:34px;font-family:'Poppins';font-weight:800;font-size:46px;color:#5B2A86}
</style></head><body>
<div id="gates" class="abs full"><img src="g-Neha.jpg"><img src="g-Riya.jpg"><img src="g-Ankit.jpg"><img src="g-Simran.jpg"></div>
<svg id="ring" class="abs" viewBox="0 0 1080 1920"><path id="ringp" fill="none" stroke="#FFD84D" stroke-width="12" stroke-linecap="round"/></svg>
<div id="wa" class="abs full"><div class="hd"><div class="av">💕</div>Neha</div>
 <div class="b s lk" id="wa1" style="top:300px"><img src="../r2/wa-preview.png"><div class="t">Priya &amp; Rahul ki shaadi 💍</div><div class="u">priya-rahul.vivah.online/Neha</div><div class="m">Neha, tumhara invite 💌</div><div class="tm">9:41 ✓✓</div></div>
 <div class="b r" id="wa2" style="top:1080px">OMG mera naam likha hai!! 😭💖<div class="tm">9:42</div></div>
</div>
<div id="end" class="abs full"><img src="../r2/logo-stacked-1810.png"><div class="t">Har guest ko uske<br>naam wala invite 💌</div><div class="u">vivah.online</div><div class="p">Sirf ₹799 · Free preview</div></div>
<div id="frs"></div>
<div id="pops"></div>
<div id="stamp" class="abs">BAS ₹799 😌<small>POORI WEDDING WEBSITE</small></div>
<div id="hook" class="abs">Mere shaadi invite pe<br>friends ka reaction 😭💌</div>
<div id="rips"></div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eBack=x=>{const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function set(el,o,x=0,y=0,s=1,r=0){el.style.opacity=o;el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;}
const M=[0,4.6,11.05,17.7,23.05,28.4], END=M[5]+1.7;
const WA=[M[1]+4.3,M[2]];
const GT=[M[2],M[2]+1.0,M[2]+1.75,M[2]+2.45,M[2]+3.15];
const FR=[['R','Riya','Yaar ye kahan se banaya?? 😍','#5B2A86',150,330],['A','Ankit','Bhai mera naam likha hai 😂🔥','#D62E55',110,610],['S','Simran','Kitne ka pada?? 👀','#2B6CB0',190,890]];
const frs=FR.map(([i,n,m,c,x,y],k)=>{const d=document.createElement('div');d.className='abs fr';d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=`<div class="av" style="background:${c}">${i}</div><div class="bb"><b>${n}</b><span>${m}</span></div>`;$('frs').appendChild(d);return {d,a:M[2]+4.28+k*0.5};});
// pops [t0,t1,text,sticker,x,y,purple,strikeAt]
const PO=[
 [M[0]+3.4,M[1]-0.1,'PAGAL HO GAYE','party',300,560,0,0],
 [M[1]+1.0,M[1]+4.2,'APNI WEBSITE','sparkle',330,330,1,0],
 [M[3]+0.0,M[3]+2.7,'SCRATCH = DATE','sparkle',260,330,1,0],
 [M[3]+2.74,M[4]-0.05,'VENUE + FUNCTIONS','pin',180,330,0,0],
 [M[4]+1.3,M[4]+3.94,'Bahut mehenga?','money',260,560,1,M[4]+3.3],
 [M[5],END,'LINK BIO MEIN','point',300,560,0,0],
];
const pops=PO.map(([a,b,tx,st,x,y,j,s])=>{const d=document.createElement('div');d.className='abs pop';d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=`<span class="${j?'j':''}">${tx}<i></i></span><img src="../r2/st/${st}.png">`;$('pops').appendChild(d);return {a,b,d,s,x};});
const R=[[M[1]+0.15,540,1620]];
const rips=R.map(([a,x,y])=>{const d=document.createElement('div');d.className='abs';d.innerHTML='<div class="dot abs" style="left:-35px;top:-35px"></div><div class="rip abs" style="left:-75px;top:-75px"></div>';d.style.left=x+'px';d.style.top=y+'px';$('rips').appendChild(d);return {a,d};});
function fit(){pops.forEach(p=>{const w=p.d.getBoundingClientRect().width;if(p.x+w>1050)p.d.style.left=Math.max(30,1050-w)+'px';});}
function ellipse(cx,cy,rx,ry,k){let d='';const n=60,end=k*1.12;for(let i=0;i<=n;i++){const a=-2.3+end*2*Math.PI*i/n;const wob=1+0.04*Math.sin(i*1.7);d+=(i?'L':'M')+(cx+Math.cos(a)*rx*wob).toFixed(1)+' '+(cy+Math.sin(a)*ry*wob).toFixed(1);}return d;}
function render(t){
 {const a=0.1,b=M[1]-0.1;const k=lin(t,a,a+0.3);set($('hook'),t>=a&&t<b?Math.min(1,k*2)*(1-lin(t,b-0.15,b)):0,0,(1-eOut(k))*-40,0.85+0.15*eBack(k));}
 // whatsapp
 {const on=t>=WA[0]&&t<WA[1];const k0=lin(t,WA[0],WA[0]+0.2);$('wa').style.opacity=on?1:0;$('wa').style.transform=`translateX(${(1-eOut(k0))*1080}px)`;
  const k1=lin(t,WA[0]+0.25,WA[0]+0.45);set($('wa1'),on&&t>=WA[0]+0.25?1:0,0,0,0.75+0.25*eOut(k1));
  const k2=lin(t,WA[0]+1.25,WA[0]+1.45);set($('wa2'),on&&t>=WA[0]+1.25?1:0,0,0,0.75+0.25*eOut(k2));}
 // gates with ring around name
 const gi=[...$('gates').children];let cur=-1;for(let i=0;i<4;i++)if(t>=GT[i]&&t<GT[i+1])cur=i;
 gi.forEach((im,i)=>{im.style.opacity=i===cur?1:0;if(i===cur){const k=1-eOut(lin(t,GT[i],GT[i]+0.2));im.style.transform=`scale(${1+0.05*k})`;}});
 {const on=cur>=0;const k=on?eOut(lin(t,GT[cur]+0.05,GT[cur]+0.4)):0;$('ringp').setAttribute('d',on?ellipse(540,1592,250,80,k):'');$('ring').style.opacity=on?1:0;}
 frs.forEach(({d,a})=>{const b=M[3];const k=lin(t,a,a+0.25);set(d,t>=a&&t<b?Math.min(1,k*2)*(1-lin(t,b-0.12,b)):0,0,(1-eOut(k))*40,0.7+0.3*eBack(k));});
 pops.forEach(({a,b,d,s})=>{const on=t>=a&&t<b;const k=lin(t,a,a+0.28);set(d,on?Math.min(1,k*2.5)*(1-lin(t,b-0.12,b)):0,0,0,0.3+0.7*eBack(k),on?Math.sin((t-a)*3)*2-2:0);
  if(s)d.querySelector('i').style.transform=`rotate(-6deg) scaleX(${eOut(lin(t,s,s+0.3))})`;});
 rips.forEach(({a,d})=>{const on=t>=a-0.15&&t<a+0.5;d.style.opacity=on?1-lin(t,a+0.2,a+0.5):0;d.children[0].style.transform=`scale(${t<a?1:0.75})`;d.children[1].style.transform=`scale(${0.4+eOut(lin(t,a,a+0.45))*0.9})`;d.children[1].style.opacity=t>=a?1:0;});
 {const a=M[4]+3.94,b=M[5];const k=lin(t,a,a+0.18);set($('stamp'),t>=a&&t<b?Math.min(1,k*2)*(1-lin(t,b-0.1,b)):0,0,0,2.1-1.1*eOut(k),-6);}
 {const k=lin(t,END,END+0.3);$('end').style.opacity=k;$('end').style.transform=`scale(${1.06-0.06*eOut(k)})`;}
}
window.render=render;
window.imgReady=()=>Promise.all([...document.images].filter(i=>!i.complete).map(i=>new Promise(r=>{i.onload=i.onerror=r;})));
document.fonts.ready.then(()=>{fit();render(0);});
</script></body></html>
