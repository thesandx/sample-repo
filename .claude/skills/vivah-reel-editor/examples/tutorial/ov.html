<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Huninn&display=block">
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#FBE3EC 0%,#EBD9F6 55%,#FCE7E0 100%)}
#frame{position:absolute;left:116px;top:232px;width:848px;height:1456px;border-radius:52px;background:#1d1220;box-shadow:0 30px 80px rgba(61,31,46,.35)}
#chip{position:absolute;left:50%;top:118px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#fff;border-radius:60px;padding:14px 38px 14px 16px;font-family:Poppins;font-weight:800;font-size:46px;color:#3D1F2E;white-space:nowrap;box-shadow:0 8px 24px rgba(61,31,46,.18)}
#chip .n{width:64px;height:64px;border-radius:50%;background:#D62E55;color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px}
#chip.nonum{padding-left:38px}#chip.nonum .n{display:none}
#call{position:absolute;background:#D62E55;color:#fff;font-family:Poppins;font-weight:800;font-size:44px;padding:14px 32px;border-radius:40px;transform:rotate(-4deg);box-shadow:0 8px 20px rgba(0,0,0,.25);white-space:nowrap}
#end{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#7B3FA8 0%,#5B2A86 45%,#3D1F2E 100%);display:none;flex-direction:column;align-items:center;padding-top:300px;color:#fff;text-align:center}
#end .l{font-family:Huninn;font-size:64px;line-height:1.25}
#end .u{margin-top:60px;background:#fff;color:#D62E55;font-family:Poppins;font-weight:900;font-size:84px;padding:18px 60px;border-radius:80px}
#end .p{margin-top:70px;font-family:Poppins;font-weight:800;font-size:56px}
#end .p span{font-size:120px;display:block;color:#FFD86B;line-height:1.05}
#end .c{margin-top:50px;border:6px dashed #FFD86B;border-radius:30px;padding:20px 44px;font-family:Poppins;font-weight:800;font-size:50px}
#end .c b{color:#FFD86B}
#cap{position:absolute;left:60px;right:60px;top:1180px;text-align:center;font-family:Poppins;font-weight:800;font-size:80px;line-height:1.15;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.55),0 0 4px rgba(0,0,0,.6)}
#cmt{position:absolute;left:60px;top:150px;background:#fff;border-radius:28px;padding:22px 30px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:Poppins;width:640px}
#cmt .a{font-size:26px;color:#777;font-weight:600}
#cmt .b{font-size:40px;font-weight:800;color:#222;margin-top:4px}
#cmt .c{font-size:28px;color:#555;font-weight:600;margin-top:4px}
</style></head><body>
<div id="bg"></div><div id="frame"></div><div id="chip"><span class="n"></span><span class="t"></span></div><div id="call"></div><div id="cap"></div>
<div id="cmt"><div class="a">Reply to comments</div><div class="b">Comment "LINK" 👇</div><div class="c">Website ka link DM mein bhejti hoon 💌</div></div>
<div id="end"><div class="l">Apni shaadi ki<br>personal website banao 💌</div><div class="u">vivah.online</div>
<div class="p">5 minute mein, sirf<span>₹799</span></div><div class="c">Code <b>NEW30</b> = 30% off</div></div>
<script>
const ids=['bg','frame','chip','call','cap','cmt','end'];
window.show=(o)=>{ids.forEach(i=>document.getElementById(i).style.display='none');
 for(const k in o){const e=document.getElementById(k);e.style.display=k=='end'?'flex':(k=='chip'?'flex':'block');
  if(k=='chip'){e.className=o.chip.n?'':'nonum';e.querySelector('.n').textContent=o.chip.n||'';e.querySelector('.t').innerHTML=o.chip.t}
  if(k=='call'){e.innerHTML=o.call.t;e.style.left=o.call.x+'px';e.style.top=o.call.y+'px'}
  if(k=='cap')e.innerHTML=o.cap}}
</script></body></html>
