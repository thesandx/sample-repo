<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bungee&family=Abril+Fatface&family=Permanent+Marker&family=Rubik+Mono+One&family=Courier+Prime:wght@700&family=Poppins:wght@600;800&display=block">
<link rel="stylesheet" href="../reel/fonts/local.css">
<script src="lottie.min.js"></script><script src="lot.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#111}
body{position:relative;font-family:'Poppins',sans-serif}
.abs{position:absolute}
#bgwrap{inset:0;overflow:hidden}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;transform-origin:50% 40%}
#vig{inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 75%,rgba(0,0,0,.25) 100%)}
/* torn paper strip with ransom title */
#strip{left:-20px;top:96px;width:1120px;height:200px;background:linear-gradient(rgba(255,252,246,.6),rgba(255,252,246,.6)),url(web/paper.webp) center/cover;
 clip-path:polygon(0% 8%,4% 2%,9% 7%,15% 1%,21% 6%,27% 2%,33% 8%,40% 3%,46% 7%,53% 1%,60% 6%,66% 2%,73% 8%,80% 3%,86% 7%,93% 2%,100% 6%,100% 92%,95% 98%,89% 93%,82% 99%,76% 94%,69% 98%,62% 93%,55% 99%,48% 94%,41% 98%,34% 92%,27% 98%,20% 93%,13% 99%,7% 94%,0% 97%);
 box-shadow:0 8px 20px rgba(0,0,0,.25)}
#title{left:0;top:96px;width:1080px;height:200px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:nowrap}
.L{display:inline-block;padding:4px 10px 6px;font-size:108px;line-height:1;box-shadow:2px 3px 0 rgba(0,0,0,.18)}
#tsticker{width:170px;height:170px}
/* captions */
#cap{left:90px;width:900px;top:1350px;text-align:center}
#cap span.box{display:inline-block;background:rgba(40,30,34,.62);color:#fff;font-size:44px;font-weight:600;padding:8px 26px 12px;border-radius:14px;line-height:1.25}
#cap b{color:#FFD84D;font-weight:800}
.st{width:220px;height:220px;filter:drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(6px 8px 6px rgba(0,0,0,.25))}
.st img{width:100%;height:100%;filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff)}
/* sticky note */
#note{left:60px;top:880px;width:420px;height:467px;background:url(web/note.png) center/100% 100% no-repeat;filter:drop-shadow(6px 10px 14px rgba(0,0,0,.35));padding:120px 40px 30px;font-family:'Permanent Marker';color:#2a2a2a;font-size:56px;line-height:1.1}

#note .x{position:relative;display:inline-block}
#note .x i{position:absolute;left:-6px;top:52%;height:9px;background:#D62E55;border-radius:5px;transform:rotate(-8deg)}
/* framed screen */
#frame{left:250px;top:420px;width:580px;height:1000px;background:#fff;padding:18px;border-radius:26px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
#frame .in{width:544px;height:964px;border-radius:14px;overflow:hidden;position:relative}
#frame img{position:absolute;left:0;top:0;width:544px;height:1020px;object-fit:cover;object-position:top}
/* stamp */
#stamp{left:170px;top:1060px;width:740px;text-align:center;font-family:'Rubik Mono One';color:#D62E55;font-size:110px;line-height:1;border:12px solid #D62E55;border-radius:22px;padding:24px 10px 30px;mix-blend-mode:multiply;background:rgba(255,255,255,.55)}
/* handwritten + highlight */
#hw{z-index:5;left:0;width:1080px;top:150px;text-align:center;font-family:'Permanent Marker';font-size:64px;color:#1d1d1d}
#hw span{background:linear-gradient(transparent 55%,#FFD84D 55%,#FFD84D 92%,transparent 92%);padding:0 10px}
/* end card */
#end{inset:0;background:#FFFCF8;display:flex;flex-direction:column;align-items:center;padding-top:300px}
#end img{width:560px}
#end .t{font-family:'Huninn';font-size:66px;color:#3D1F2E;margin-top:60px;text-align:center;line-height:1.2}
#end .u{margin-top:40px;background:#D62E55;color:#fff;font-family:'Huninn';font-size:76px;padding:16px 56px 24px;border-radius:70px}
#flashw{inset:0;background:#fff;opacity:0}
</style></head><body>
<div id="bgwrap" class="abs"><img id="bg" src="priya.png"></div>
<div id="vig" class="abs"></div>
<div id="frame" class="abs"><div class="in"><img id="scr" src="src/f00001.jpg"></div></div>
<div id="note" class="abs"><div>Purana plan:</div><div><span class="x">400 cards<i></i></span></div><div style="font-size:44px;margin-top:10px">aadhe drawer mein 🙄</div></div>
<div id="stamp" class="abs">SIRF ₹799</div>
<div id="hw" class="abs"><span id="hwt">Phir maine ye kiya</span></div>
<div id="strip" class="abs"></div>
<div id="title" class="abs"></div>
<div id="stickers"></div>
<div id="cap" class="abs"><span class="box" id="capbox"></span></div>
<div id="end" class="abs"><img src="logo-stacked-1810.png"><div class="t">Free preview banao 👇</div><div class="u">vivah.online</div><div class="t" style="font-size:48px;margin-top:50px">Link bio mein hai 💌</div></div>
<div id="flashw" class="abs"></div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eIn=x=>x*x*x;
const eBack=x=>{const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function set(el,o,x=0,y=0,s=1,r=0){el.style.opacity=o;el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;}
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

// ---- data (times in seconds; swap in real clip word timings later) ----
const D=window.REEL||{
 dur:25,
 cuts:[0,1.6,5,7.4,10,15,17.2,21,25],              // jump-cut points -> punch zoom alternates
 titles:[ // ransom cut-out keyword titles
  {w:'RUKO!',t0:0.0,t1:1.6,st:'hand'},
  {w:'HAZAARON',t0:1.6,t1:5,st:'money'},
  {w:'400 CARDS',t0:5,t1:10,st:'trash'},
  {w:'APNA NAAM',t0:12.2,t1:15,st:'eyes'},
  {w:'SAB EK LINK',t0:15,t1:19.2,st:'sparkle'},
  {w:'BESTIE KO',t0:21,t1:23.4,st:'love'},
 ],
 words:[ // [start, word]
  [0.1,'Ruko'],[0.45,'ruko!'],[1.6,'Shaadi'],[1.95,'ke'],[2.1,'cards'],[2.45,'pe'],[2.65,'hazaaron'],[3.2,'rupaye'],[3.7,'mat'],[3.95,'udaana.'],
  [5.0,'Mummy'],[5.35,'400'],[5.8,'card'],[6.05,'chhapwa'],[6.45,'rahi'],[6.7,'thi,'],[7.4,'aur'],[7.6,'aadhe'],[7.95,'toh'],[8.15,'drawer'],[8.55,'mein'],[8.75,'hi'],[8.9,'pade'],[9.2,'reh'],[9.4,'jaate.'],
  [10.0,'Phir'],[10.3,'maine'],[10.6,'vivah.online'],[11.2,'pe'],[11.35,'wedding'],[11.7,'website'],[12.0,'banayi.'],[12.4,'Har'],[12.6,'guest'],[12.9,'ko'],[13.05,'uske'],[13.35,'apne'],[13.65,'naam'],[13.95,'wala'],[14.2,'invite.'],
  [15.0,'Scratch'],[15.35,'karke'],[15.6,'date,'],[15.95,'countdown,'],[16.5,'Maps,'],[16.9,'RSVP,'],[17.4,'sab'],[17.6,'WhatsApp'],[18.0,'pe.'],[18.6,'Aur'],[18.85,'sirf'],[19.15,'₹799!'],
  [21.0,'Link'],[21.25,'bio'],[21.45,'mein.'],[21.8,'Ye'],[21.95,'video'],[22.25,'us'],[22.4,'bestie'],[22.8,'ko'],[22.95,'bhejo'],[23.3,'jiski'],[23.6,'shaadi'],[23.9,'hai!'],
 ],
 lines:[0,10,25,40,52,64], // word index where a caption line breaks (groups)
 stickers:[ // extra mid-frame stickers
  {s:'shock',x:720,y:820,t0:2.7,t1:5,sz:250},
  {s:'phone',x:120,y:900,t0:10.4,t1:12.2,sz:240},
  {s:'cursor',x:640,y:1050,t0:12.5,t1:14.8,sz:170,tap:true},
  {s:'fire',x:760,y:1120,t0:19.3,t1:21,sz:260},
  {s:'up',x:820,y:560,t0:21,t1:23.4,sz:220},
 ],
 note:[5.3,10],
 frame:[{t0:12.2,t1:15,a:0.3,sp:1.2},{t0:15,t1:16.5,a:12.4,sp:2.4},{t0:16.5,t1:17.6,a:21.0,sp:1},{t0:17.6,t1:18.6,a:24.8,sp:1.2},{t0:18.6,t1:19.3,a:39.0,sp:1}],
 hw:[10,12.2],
 stamp:[19.2,21],
 end:23.4,
};

// build ransom letters
const FONTS=["Anton","Archivo Black","Bungee","Abril Fatface","Rubik Mono One","Courier Prime","Poppins"];
const PAL=[["#fff","#111"],["#111","#fff"],["#D62E55","#fff"],["#FFD84D","#111"],["#5B2A86","#fff"],["#F2E6D0","#7a1530"],["#fff","#D62E55"],["#2B6CB0","#fff"]];
const TT=D.titles.map((ti,k)=>{seed=31+k*97;const box=document.createElement('div');box.className='abs';box.style.cssText='left:0;top:96px;width:1080px;height:200px;display:flex;align-items:center;justify-content:center;gap:4px';
 const letters=[];
 for(const ch of ti.w){ if(ch===' '){const sp=document.createElement('span');sp.style.width='26px';sp.style.display='inline-block';box.appendChild(sp);continue;}
  const s=document.createElement('span');s.className='L';const p=PAL[Math.floor(rnd()*PAL.length)];s.style.background=p[0];s.style.color=p[1];s.style.fontFamily=FONTS[Math.floor(rnd()*FONTS.length)];s.textContent=ch;s.dataset.r=((rnd()-.5)*14).toFixed(1);s.dataset.y=((rnd()-.5)*16).toFixed(1);box.appendChild(s);letters.push(s);}
 const im=document.createElement('div');im.style.cssText='width:160px;height:160px;flex:none;margin-left:14px;filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff)';box.appendChild(im);
 $('title').parentNode.insertBefore(box,$('stickers'));
 im.anim=lottie.loadAnimation({container:im,renderer:'svg',loop:false,autoplay:false,animationData:LOT[ti.st]});
 // shrink to fit
 let f=108;const W=()=>[...box.children].reduce((a,c)=>a+c.getBoundingClientRect().width+4,0);box.style.display='flex';while(W()>1030&&f>60){f-=4;letters.forEach(l=>l.style.fontSize=f+'px');}
 return {ti,box,letters,im};
});
const SS=D.stickers.map(st=>{const d=document.createElement('div');d.className='abs st';d.style.left=st.x+'px';d.style.top=st.y+'px';d.style.width=d.style.height=st.sz+'px';$('stickers').appendChild(d);if(LOT[st.s]){d.anim=lottie.loadAnimation({container:d,renderer:'svg',loop:false,autoplay:false,animationData:LOT[st.s]});}else d.innerHTML=`<img src="st/${st.s}.png">`;return {st,d};});

let lastScr='';
function render(t){
 // background punch zooms on each cut, alternating scale; slow drift
 let ci=0;for(let i=0;i<D.cuts.length;i++)if(t>=D.cuts[i])ci=i;
 const lc=t-D.cuts[ci];
 const base=ci%2? 1.16:1.04;
 const kick=0.05*(1-eOut(lin(lc,0,0.25)));
 const shake=(t<0.4)?Math.sin(t*80)*10*(1-t/0.4):0;
 $('bg').style.transform=`translate(${shake}px,0) scale(${base+kick+lc*0.008})`;
 $('flashw').style.opacity=(ci>0?0.5*(1-lin(lc,0,0.08)):0);

 // titles
 TT.forEach(({ti,box,letters,im})=>{
  const on=t>=ti.t0&&t<ti.t1; box.style.display=on?'flex':'none'; if(!on)return;
  const lt=t-ti.t0;
  letters.forEach((s,i)=>{const k=lin(lt,i*0.045,i*0.045+0.08);s.style.opacity=k>0?1:0;s.style.transform=`translateY(${s.dataset.y}px) rotate(${s.dataset.r}deg) scale(${1.4-0.4*eOut(k)})`;});
  const k2=lin(lt,letters.length*0.045,letters.length*0.045+0.25);
  im.style.opacity=k2>0?1:0;if(im.anim){const L=LOT[ti.st];im.anim.goToAndStop(((lt*L.fr)%(L.op-1)),true);}im.style.transform=`scale(${0.2+0.8*eBack(k2)}) rotate(${Math.sin(lt*5)*8}deg)`;
  const ex=lin(t,ti.t1-0.12,ti.t1);box.style.opacity=1-ex;
 });
 const anyT=(TT.some(o=>t>=o.ti.t0&&t<o.ti.t1)||(t>=D.hw[0]&&t<D.hw[1]))&&t<D.end;
 $('strip').style.opacity=anyT?1:0;

 // captions: group words into lines; show words progressively, current one highlighted
 let wi=-1;D.words.forEach((w,i)=>{if(t>=w[0])wi=i;});
 if(wi>=0&&t<D.end){let g=0;for(let i=0;i<D.lines.length;i++)if(wi>=D.lines[i])g=i;
  const a=D.lines[g], b=(D.lines[g+1]??D.words.length);
  // show at most ~5 words window
  const from=Math.max(a,wi-4);
  let h='';for(let i=from;i<=wi&&i<b;i++){h+=(i===wi?'<b>'+D.words[i][1]+'</b>':D.words[i][1])+' ';}
  $('capbox').innerHTML=h.trim();$('cap').style.opacity=1;
  const k=lin(t,D.words[wi][0],D.words[wi][0]+0.08);$('cap').style.transform=`scale(${1+0.04*(1-k)})`;
 } else $('cap').style.opacity=0;

 // stickers
 SS.forEach(({st,d})=>{const on=t>=st.t0&&t<st.t1;if(!on){d.style.opacity=0;return;}const lt=t-st.t0;const k=lin(lt,0,0.3);
  let x=0,y=0;if(st.tap){const p=(lt%0.8)/0.8;y=-Math.abs(Math.sin(p*Math.PI))*30;}
  if(d.anim){const L=LOT[st.s];d.anim.goToAndStop(((lt*L.fr)%(L.op-1)),true);}
  set(d,1-lin(t,st.t1-0.1,st.t1),x,y,0.2+0.8*eBack(k),Math.sin(lt*4)*7);});

 // sticky note
 {const [a,b]=D.note;const on=t>=a&&t<b;const lt=t-a;const k=lin(lt,0,0.3);
  set($('note'),on?1-lin(t,b-0.12,b):0,0,(1-eOut(k))*-300,0.8+0.2*eBack(k),4);
  $('note').querySelector('i').style.width=(eOut(lin(lt,1.2,1.5))*108)+'%';}

 // handwritten line
 {const [a,b]=D.hw;const on=t>=a&&t<b;const lt=t-a;set($('hw'),on?lin(lt,0,0.15)*(1-lin(t,b-0.1,b)):0,0,0,1,-2);
  $('hwt').style.backgroundSize=(eOut(lin(lt,0.2,0.6))*100)+'% 100%';$('hwt').style.backgroundRepeat='no-repeat';}

 // framed product screen
 let fon=null;D.frame.forEach(f=>{if(t>=f.t0&&t<f.t1)fon=f;});
 if(fon){const f0=D.frame[0];const lt0=t-f0.t0;const k=lin(lt0,0,0.3);const lastF=D.frame[D.frame.length-1];
  set($('frame'),1-lin(t,lastF.t1-0.12,lastF.t1),0,(1-eOut(k))*900,0.85+0.15*eBack(k),-3+Math.sin(t*2)*1);
  const src=Math.max(1,Math.min(1260,Math.round((fon.a+(t-fon.t0)*fon.sp)*30)+1));
  const s='src/f'+String(src).padStart(5,'0')+'.jpg';if(s!==lastScr){$('scr').src=s;lastScr=s;}
 } else $('frame').style.opacity=0;

 // stamp
 {const [a,b]=D.stamp;const on=t>=a&&t<b;const k=lin(t-a,0,0.18);set($('stamp'),on?Math.min(1,k*2)*(1-lin(t,b-0.1,b)):0,0,0,2.2-1.2*eOut(k),-10);}

 // end card
 {const k=lin(t,D.end,D.end+0.25);$('end').style.opacity=k;$('end').style.transform=`scale(${1.08-0.08*eOut(k)})`;}
}
window.render=render;
window.imgReady=()=>Promise.all([...document.images].filter(i=>!i.complete).map(i=>new Promise(r=>{i.onload=i.onerror=r;})));
render(0);
</script></body></html>
